<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EcoQuiz ADM | Partida</title><link rel="stylesheet" href="style.css">
<style>
.game-card{max-width:760px;width:100%;background:#fff;border:1px solid #dbe9d6;border-radius:22px;padding:clamp(22px,4vw,38px);box-shadow:0 16px 45px #1b5e2015}
.game-top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;color:#47734d;font-weight:700}
.timer{font-size:1.4rem;background:#e8f5e9;border-radius:12px;padding:10px 16px;color:#1b5e20}
.question{font-size:clamp(1.35rem,3vw,2rem);line-height:1.3;margin:28px 0}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answer{border:2px solid #c8dfc8;background:#f7fbf5;color:#214d2a;border-radius:14px;padding:18px;text-align:left;min-height:76px}
.answer:disabled{opacity:.65;cursor:default}.answer.selected{border-color:#2e7d32;background:#e8f5e9}
.feedback{min-height:28px;font-weight:700;margin-top:18px}.muted{color:#628068}
@media(max-width:560px){.answers{grid-template-columns:1fr}}
</style></head>
<body><header class="topo"><a class="marca" href="index.html">🌿 EcoQuiz <strong>ADM</strong></a><span class="slogan">Aprender também é cuidar</span></header>
<main><section class="game-card">
<div class="game-top"><span id="welcome">Conectando à partida...</span><span class="timer" id="timer">--</span></div>
<p class="etiqueta">ECOQUIZ • PARTIDA AO VIVO</p><h1 id="phaseTitle">Sala de espera</h1>
<p id="questionProgress" class="muted"></p><div id="questionText" class="question">Aguarde a professora iniciar o jogo.</div>
<div id="answers" class="answers"></div><p id="feedback" class="feedback" role="status"></p>
<p id="scoreLine" class="muted"></p><button id="leave" type="button">Sair da sala</button>
</section></main><footer>EcoQuiz ADM • Educação e consciência ambiental</footer><script type="module" src="sala.js"></script></body></html>
