<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conduzir partida | EcoQuiz ADM</title><link rel="stylesheet" href="style.css">
<style>
.host-card{max-width:850px;width:100%;background:#fff;border:1px solid #dbe9d6;border-radius:22px;padding:clamp(22px,4vw,38px);box-shadow:0 16px 45px #1b5e2015}
.host-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pin-display{font-size:2rem;letter-spacing:.18em;font-weight:900;color:#1b5e20}
.host-question{font-size:1.5rem;line-height:1.35;margin:24px 0}
.host-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.host-actions button{padding:13px 18px;border:0;border-radius:10px;font-weight:700;cursor:pointer;background:#1b5e20;color:white}
.host-actions .secondary{background:#e8f5e9;color:#1b5e20}
.host-list{padding-left:22px;line-height:1.9}.host-stats{color:#52765a}
.player-avatar{width:24px;height:28px;object-fit:contain;vertical-align:middle;margin-right:6px}
.host-list li{display:flex;align-items:center;gap:4px}
.ranking-panel{margin-top:30px;padding:24px;border-radius:20px;background:linear-gradient(145deg,#f4faef,#e5f2df);border:1px solid #cfe4cc;text-align:center}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;min-height:250px;margin:24px auto 18px;max-width:650px}
.podium-place{flex:1;max-width:190px;border-radius:16px 16px 8px 8px;padding:14px 8px 16px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;box-shadow:0 8px 20px #173e2412}
.podium-place.first{order:2;min-height:235px;background:linear-gradient(#fff3c4,#f6d76b);border:2px solid #d9ad32}
.podium-place.second{order:1;min-height:195px;background:linear-gradient(#f4f6f7,#cbd3da);border:2px solid #aeb8c1}
.podium-place.third{order:3;min-height:165px;background:linear-gradient(#f8e0ce,#cd9468);border:2px solid #b77b50}
.podium-place img{width:88px;height:100px;object-fit:contain}
.podium-place.first img{width:116px;height:128px}
.podium-trophy{font-size:2rem;line-height:1.2}
.podium-name{font-weight:800;color:#24452b;overflow-wrap:anywhere;margin-top:5px}
.podium-score{font-size:.9rem;font-weight:700;color:#47634b}
.other-players{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.other-player{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #dbe9d6;border-radius:999px;padding:6px 12px;font-size:.82rem}
.other-player img{width:25px;height:28px;object-fit:contain}
@media(max-width:520px){.podium{gap:5px}.podium-place{padding:10px 4px}.podium-place img{width:58px;height:70px}.podium-place.first img{width:76px;height:88px}.podium-name{font-size:.78rem}}

.join-box{display:flex;align-items:center;justify-content:center}
.qr-area{width:220px;text-align:center;padding:14px;background:#f3f8ef;border:1px solid #dbe9d6;border-radius:16px}
.qr-area p{font-size:.88rem;font-weight:700;color:#315b36;margin:0 0 10px}
.qr-area img{display:block;width:180px;height:180px;max-width:100%;margin:auto;background:#fff;border-radius:8px}
.qr-area small{display:block;color:#52765a;font-size:.72rem;margin-top:9px}
.qr-area .pin-display{font-size:1.8rem;letter-spacing:.2em;margin-top:2px}
@media(max-width:520px){.join-box{justify-content:center}.qr-area{width:100%;max-width:220px}}
</style></head><body><header class="topbar"><a class="brand" href="../index.html">🌱 EcoQuiz <b>ADM</b></a><a href="index.html" class="back">← Voltar ao painel</a></header>
<main class="room-main"><section class="host-card">
<div class="host-head"><div><p class="eyebrow">SALA DE JOGO</p><h1>Partida ao vivo</h1></div><div class="join-box">
  <div class="qr-area">
    <p>📱 Escaneie para entrar na partida</p>
    <img id="roomQr" alt="QR Code para entrar na sala" width="180" height="180">
    <small>PIN DA SALA</small>
    <div id="pin" class="pin-display">------</div>
  </div>
</div></div>
<p id="roomState" class="host-stats">Aguardando alunos entrarem...</p><div class="host-stats"><strong id="playerCount">0</strong> alunos conectados</div>
<h2 id="hostProgress">Participantes</h2><div id="hostQuestion" class="host-question">Compartilhe o PIN e aguarde a turma.</div>
<div id="hostOptions"></div><p id="hostTimer" class="host-stats"></p><h2>Participantes e pontuação</h2><ul id="players" class="host-list"></ul>
<section id="rankingPanel" class="ranking-panel" hidden>
  <h2>🏆 Pódio EcoQuiz</h2>
  <p class="host-stats">Os destaques da partida</p>
  <div id="podium" class="podium"></div>
  <div id="otherPlayers" class="other-players"></div>
</section>
<p id="roomError" class="error"></p><div class="host-actions"><button id="start" type="button">Iniciar partida</button><button id="next" class="secondary" type="button" hidden>Próxima pergunta</button><button id="close" class="secondary" type="button">Encerrar sala</button></div>
</section></main><script type="module" src="sala-professora.js"></script></body></html>
